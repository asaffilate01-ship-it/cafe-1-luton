name: Production smoke

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS origin to verify after deployment
        required: true
        default: https://cafe1luton.co.uk
        type: string
      expected_release_sha:
        description: Expected deployed 40-character Git commit; blank uses the workflow commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cafe1-production-smoke
  cancel-in-progress: false

env:
  DEFAULT_PRODUCTION_BASE_URL: https://cafe1luton.co.uk

jobs:
  smoke:
    name: Public deployment and headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify release integrity
        run: npm run release:guard

      - name: Clean install
        run: npm ci

      - name: Verify deployed release
        env:
          PRODUCTION_BASE_URL: ${{ inputs.base_url || env.DEFAULT_PRODUCTION_BASE_URL }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha || github.sha }}
        run: mkdir -p release-evidence && set -o pipefail; npm run smoke:production -- --json release-evidence/production-smoke.json 2>&1 | tee release-evidence/production-smoke.log

      - name: Record repository status
        if: always()
        run: |
          npm run verify:dependencies -- --output release-evidence/dependency-contract.json
          npm run verify:migrations -- --output release-evidence/migration-integrity.json
          npm run verify:capabilities -- --output release-evidence/software-capabilities.json
          npm run release:status -- --production-smoke release-evidence/production-smoke.json --output release-evidence/release-status.json

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cafe1-production-smoke-${{ github.sha }}-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
