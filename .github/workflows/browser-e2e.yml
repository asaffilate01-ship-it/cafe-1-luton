name: Browser journeys

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafe1-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Desktop and mobile Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify release integrity
        run: npm run release:guard

      - name: Clean install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only go-live journeys
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cafe1-browser-evidence-${{ github.sha }}
          path: |
            release-evidence/playwright-report.json
            playwright-report/
            test-results/playwright/
          if-no-files-found: warn
          retention-days: 30
