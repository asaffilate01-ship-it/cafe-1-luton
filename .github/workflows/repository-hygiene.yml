name: Remove tracked environment files

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE-TRACKED-ENV to create the cleanup commit
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: cafe1-repository-hygiene-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remove-environment-files:
    name: Commit environment-file removal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm destructive scope
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DELETE-TRACKED-ENV" ]; then
            echo "Confirmation did not match DELETE-TRACKED-ENV. No repository changes were made."
            exit 1
          fi

      - name: Check out selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fast-forward before cleanup
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Remove environment files from Git tracking
        run: node scripts/repository-hygiene.mjs --apply

      - name: Commit cleanup normally
        id: cleanup
        run: |
          if git diff --cached --quiet; then
            echo "No tracked environment files remain."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove tracked environment files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run checks on the cleaned commit
        if: steps.cleanup.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run browser-e2e.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run codeql.yml --ref "${GITHUB_REF_NAME}"
