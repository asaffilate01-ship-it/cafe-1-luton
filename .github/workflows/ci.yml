name: Production checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafe1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify release integrity
        run: npm run release:guard

      - name: Clean install
        run: npm ci

      - name: Typecheck, lint, test and build
        run: npm run check

      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high

      - name: Record application evidence
        if: always()
        run: npm run release:status -- --output release-evidence/release-status.json

      - name: Upload application evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cafe1-application-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

  database:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Start local database and apply every migration
        run: supabase db start

      - name: Rebuild database from every migration
        run: supabase db reset

      - name: Run database assertions
        run: supabase test db

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
